<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>配對 半雲電話</title>
<style>body{margin:0;background:#0c121b;color:#e9eef7;font:17px system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(88vw,380px)}p{color:#adbbcf;line-height:1.7}input,button{box-sizing:border-box;width:100%;font:22px system-ui;padding:18px;border-radius:14px;margin-top:16px}input{background:#192536;color:white;border:1px solid #47556a;text-align:center;letter-spacing:.4em}button{background:#70dcba;color:#08241d;border:0;font-size:18px;font-weight:600}#message{color:#ffc0bd;min-height:2em}</style>
<main><h1>配對電話</h1><p>輸入 受控電話「半雲電話」App 顯示的 6 位配對 PIN。</p><form id="pair"><input id="pin" aria-label="配對 PIN" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="off" required><button id="pair-submit" type="submit">配對並連接</button><button id="show-pin" type="button" style="padding:10px;font-size:15px;background:#1c2d40;color:#d0dced">顯示 PIN</button></form><p id="message" role="status"></p></main>
<script src="/static/marble-pairing.js"></script></html>
