<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1218"><title>半雲電話</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1218;color:#edf5f4;display:grid;place-items:center;padding:32px 24px}main{width:min(100%,420px)}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#bfcece;margin-bottom:48px}.mark{display:grid;place-items:center;width:30px;height:30px;background:#89e1c5;color:#15352c;border-radius:10px;font-weight:800;font-size:18px}.eyebrow{font-size:11px;letter-spacing:2px;color:#89e1c5}h1{font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1.3;margin:14px 0 16px}.intro{font-size:14px;line-height:1.9;color:#91a8b2;margin-bottom:30px}.device{display:flex;align-items:center;gap:16px;border:1px solid #2a3d47;background:#14222b;padding:22px;border-radius:20px;margin-bottom:18px}.phone{height:54px;width:28px;border:2px solid #6caaa3;border-radius:7px;position:relative;background:#193b35}.phone:after{content:'';position:absolute;width:8px;height:2px;border-radius:2px;background:#89e1c5;bottom:4px;left:8px}.device strong{font-size:16px;display:block}.device small{display:block;color:#8fa6af;font-size:12px;margin-top:7px}.device .dot{width:7px;height:7px;background:#89e1c5;border-radius:50%;margin-left:auto}button{width:100%;min-height:56px;border:0;border-radius:14px;padding:16px;background:#89e1c5;color:#14372c;font:600 16px inherit;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #b4f2dc;outline-offset:5px}.features{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.features span{border:1px solid #263740;border-radius:20px;padding:7px 10px;font-size:11px;color:#99b0ba}.note{margin-top:32px;padding-top:20px;border-top:1px solid #22323b;font-size:12px;line-height:1.9;color:#78939f}#error{color:#f0b4a3;font-size:13px;line-height:1.8;margin:12px 0 0}#error:empty{display:none}@media(max-height:650px){.brand{margin-bottom:24px}h1{font-size:28px}.intro{margin-bottom:20px}.note{margin-top:20px}}
.stream-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.stream-options label{font-size:11px;color:#8fa6af}.stream-options select{width:100%;margin-top:8px;padding:12px 8px;border:1px solid #344952;border-radius:10px;background:#14222b;color:#edf5f4;font:13px inherit}#stream-hint{font-size:11px;color:#8fa6af;line-height:1.8;margin:10px 0 18px}</style></head><body><main><div class="brand"><span class="mark" aria-hidden="true">↗</span>半雲電話</div><div class="eyebrow">你嘅電話，隨時在手</div><h1>連接，即刻操作。</h1><p class="intro">用瀏覽器開返完整電話畫面，<br>滑動、打字，同平時用電話一樣。</p><div class="device"><span class="phone" aria-hidden="true"></span><div><strong id="device-name">Android 裝置</strong><small>Android · 受控裝置</small></div><span class="dot" aria-hidden="true"></span></div><div class="stream-options"><label>要求幀率<select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option><option value="120">120 FPS</option></select></label><label>畫面大小<select id="size"><option value="960">960 · 流暢</option><option value="1280">1280 · 平衡</option><option value="1920">1920 · 清晰</option></select></label><label>位元率<select id="mbps"><option value="2">2 Mbps</option><option value="4">4 Mbps</option><option value="8">8 Mbps</option><option value="12">12 Mbps</option><option value="20">20 Mbps</option></select></label></div><p id="stream-hint">幀率係上限，實際速度受電話、畫面內容及網絡影響。120 FPS 需要相容硬件。</p><button id="connect">連接電話 →</button><p id="error" role="status"></p><div class="features"><span>觸控與滑動</span><span>中文輸入</span><span>聲音播放</span></div><p class="note">目前使用同一 Wi-Fi 直連。<br>最多 4 部裝置同時睇畫面及操作；所有操作會作用喺同一部電話。</p></main>
<script src="/static/stream-preferences.js"></script><script>
let remotePreferences;try{remotePreferences=RemoteStreamPreferences.normalize(JSON.parse(localStorage.getItem("remote_stream_preferences")||"{}"));}catch{remotePreferences=RemoteStreamPreferences.normalize();}for(const k of ["fps","size","mbps"])document.getElementById(k).value=remotePreferences[k];

document.querySelector('#connect').onclick=async()=>{
 const button=document.querySelector('#connect');button.disabled=true;button.textContent='正在準備連線…';
 try{
  const r=await fetch('/api/device/list',{credentials:'same-origin'});
  if(r.status===401){location.href='/unlock';return;}
  if(!r.ok)throw Error('未能取得電話狀態');
  const data=await r.json();const d=data.devices?.find(d=>d.device_type==='android');
  if(!d)throw Error('電話尚未準備好');
  const preferences=RemoteStreamPreferences.normalize(Object.fromEntries(['fps','size','mbps'].map(k=>[k,document.getElementById(k).value])));
  try{localStorage.setItem('remote_stream_preferences',JSON.stringify(preferences));}catch{}
  const statusResponse=await fetch('/api/screen/sessions',{credentials:'same-origin'});if(!statusResponse.ok)throw Error('未能核對共用畫質');const status=await statusResponse.json();
  sessionStorage.setItem('remote_device_name',d.display_name||d.device_id);
  sessionStorage.setItem('webscreen_device_configs_now',JSON.stringify({device_type:'android',device_id:d.device_id,device_ip:d.ip,device_port:String(d.port),av_sync:false,driver_config:status.stream_options||RemoteStreamPreferences.driver(preferences)}));
  location.href='/screen/marble';
 }catch(e){document.querySelector('#error').textContent=e.message;button.disabled=false;button.textContent='連接電話 →';}
};
fetch('/api/device/list',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(data=>{const d=data?.devices?.find(d=>d.device_type==='android');if(d)document.querySelector('#device-name').textContent=d.display_name||d.device_id;}).catch(()=>{});
fetch('/api/screen/sessions',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(status=>{if(status?.stream_options){const p=status.stream_options;for(const k of ['fps','size','mbps'])document.getElementById(k).disabled=true;document.querySelector('#stream-hint').textContent=`跟隨現有共用畫質：${p.max_fps} FPS、${p.max_size}。所有連線退出後可以改畫質。`;}}).catch(()=>{});
</script></body></html>
