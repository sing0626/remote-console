name: Check generic source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  privacy-and-gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/remote/gateway/go.mod
      - run: python3 scripts/check_public_tree.py
      - run: python3 scripts/sync_release.py --check
      - run: python3 scripts/check_suite.py
      - run: python3 -m unittest discover -s scripts -p 'test_manage.py'
      - run: python3 -m unittest discover -s scripts -p 'test_relay.py'
      - run: bash -n install.sh relay-install.sh deploy/remote/setup.sh
      - run: python3 -m unittest test_initialize.py
        working-directory: deploy/remote
      - run: go test -race ./...
        working-directory: deploy/remote/gateway
      - run: go test -race ./devicetools ./webservice ./sdriver/scrcpy
      - run: python3 scripts/build_native.py
  docker-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate real managed Docker install and data-preserving lifecycle
        run: sudo python3 scripts/integration_manage.py
  docker-legacy-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade synthetic legacy deployment and retain trusted login
        run: sudo python3 scripts/integration_migrate.py
  native-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native TURN, relay real payloads and retain traffic statistics
        run: sudo python3 scripts/integration_relay.py
